name: Build Aimbot Jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Setup Forge workspace
        run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G -Xms512M"

      - name: Build jar
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G -Xms512M"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: LilBigAimbot-jar
          path: build/libs/LilBigAimbot-*.jar
          if-no-files-found: error
